services:
  mineru-api:
    image: mineru:latest
    container_name: mineru-api
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      MINERU_MODEL_SOURCE: local

    entrypoint: mineru-api

    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  backend:
    external: true
    name: local-hermes_backend
