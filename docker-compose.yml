
name: local-hermes

include:
  - ./firecrawl/docker-compose.yaml
  - ./hermes-agent/docker-compose.windows.yml
  - ./LightRAG/docker-compose-full.yml
  - ./MinerU/docker-compose.yml

x-vllm: &service-vllm
  image: vllm/vllm-openai:v0.33.0
  container_name: vllm
  restart: unless-stopped

  networks:
    - backend

  ports:
    - "127.0.0.1:18000:8000"

  volumes:
    - ./vllm_storage/huggingface:/root/.cache/huggingface

  gpus: all
  ipc: host

  command:
    - google/gemma-4-12B-it-qat-w4a16-ct
    - --served-model-name
    - gemma4-12b
    - --max-model-len
    - "65536"
    - --max-num-seqs
    - "1"
    - --max-num-batched-tokens
    - "4096"
    - --gpu-memory-utilization
    - "0.85"
    - --kv-cache-dtype
    - fp8
    - --enforce-eager
    - --limit-mm-per-prompt
    - '{"image":16,"audio":0}'
    - --enable-auto-tool-choice
    - --tool-call-parser
    - gemma4
    - --reasoning-parser
    - gemma4
    - --chat-template
    - examples/tool_chat_template_gemma4.jinja

services:
  vllm:
    <<: *service-vllm

  browser-gui:
    build:
      context: ./browser-gui
    container_name: hermes-browser-gui
    restart: unless-stopped
    pid: "service:gateway"

    networks:
      - backend

    ports:
      - "127.0.0.1:6080:6080"

    volumes:
      - browser_gui_runtime:/run/user/1000

    shm_size: "4gb"

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped

    networks:
      - backend

    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 30

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  browser_gui_runtime: